name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bats:
    name: Bats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run tests
        run: bats tests/cut-tag.bats
